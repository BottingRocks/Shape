[package]
name = "shape-c"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Native C ABI for the Shape engine's source analysis and captured request header decoding and encoding"
readme = "README.md"
repository = "https://github.com/pinyugi/shapesecurity-ai"
license = "GPL-3.0-only"
publish = false
autoexamples = false

[lib]
# libshape.dylib / libshape.so / shape.dll and libshape.a
name = "shape"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
engine = { package = "shape", path = "../.." }
mimalloc = "0.1"

[dev-dependencies]
serde_json = "1"
